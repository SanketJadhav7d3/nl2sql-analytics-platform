# GitLab CI/CD for the analytics platform.
#
#   lint  -> ruff + byte-compile (fast, no DB)
#   test  -> spin up Postgres, load the committed SAMPLE warehouse, run pytest
#   build -> Kaniko-build the image and push it to the GitLab Container Registry
#
# The full Olist CSVs are gitignored (~125 MB), so CI loads data/sample/ instead
# (generated by scripts/make_sample.py). DATA_DIR points the loader at it.
# LLM_PROVIDER=echo keeps the NL-to-SQL path offline so no GEMINI_API_KEY is
# needed in CI. For a real deploy, set JWT_SECRET / GEMINI_API_KEY as masked
# CI/CD variables (Settings -> CI/CD -> Variables).

stages: [lint, test, build]

# Only run for merge requests, the default branch, and tags — and never run a
# duplicate branch pipeline while an MR is open for that branch.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Reusable pip cache keyed on the lockfiles, shared by the python jobs.
.pip-cache: &pip-cache
  cache:
    key:
      files:
        - requirements.txt
        - requirements-dev.txt
    paths:
      - .cache/pip

# ---------------------------------------------------------------------------
lint:
  stage: lint
  image: python:3.12-slim
  <<: *pip-cache
  before_script:
    - pip install -r requirements-dev.txt
  script:
    - ruff check src dashboard scripts tests
    - python -m compileall -q src dashboard scripts

# ---------------------------------------------------------------------------
test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16
      alias: postgres
  <<: *pip-cache
  variables:
    # Postgres service — matches docker-compose defaults.
    POSTGRES_USER: analytics
    POSTGRES_PASSWORD: analytics
    POSTGRES_DB: analytics
    # App config (code defaults host to localhost; CI talks to the service).
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DATA_DIR: data/sample      # load the committed sample, not data/raw
    LLM_PROVIDER: echo         # offline NL-to-SQL; no API key required
  before_script:
    - pip install -r requirements.txt
    # Wait for the Postgres service to accept connections before loading.
    - |
      python - <<'PY'
      import os, time, psycopg
      dsn = dict(host="postgres", port=5432, dbname="analytics",
                 user="analytics", password="analytics")
      for _ in range(30):
          try:
              psycopg.connect(**dsn).close(); break
          except Exception as e:
              print("waiting for postgres:", e); time.sleep(2)
      else:
          raise SystemExit("postgres never became ready")
      PY
    # Build the warehouse (sample) + seed the app schema / read-only role / admin.
    - python -m src.warehouse.load
    - python -m src.api.auth.manage init
  script:
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths:
      - report.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Build the image with Kaniko (no privileged runner needed) and push it to the
# project's Container Registry. Runs only on main and tags, after tests pass.
build:
  stage: build
  needs: ["test"]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
        > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
