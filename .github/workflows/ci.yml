# GitHub Actions CI for the analytics platform.
#
#   lint  -> ruff + byte-compile (fast, no DB)
#   test  -> spin up Postgres, load the committed SAMPLE warehouse, run pytest
#   build -> build the image and push it to GitHub Container Registry (ghcr.io)
#
# The full Olist CSVs are gitignored (~125 MB), so CI loads data/sample/ instead
# (generated by scripts/make_sample.py). DATA_DIR points the loader at it.
# LLM_PROVIDER=echo keeps the NL-to-SQL path offline so no GEMINI_API_KEY is
# needed in CI. For a real deploy, set JWT_SECRET / GEMINI_API_KEY as repository
# secrets (Settings -> Secrets and variables -> Actions).

name: CI

# Run on every branch push, on tags, and on pull requests. A push to a branch that has
# an open PR triggers the pull_request event, and the concurrency group below
# cancels the superseded branch run, so duplicates are not a problem.
on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src dashboard scripts tests
      - run: python -m compileall -q src dashboard scripts

  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        # Actions waits for this to pass before starting the job, which
        # replaces the manual connect-retry loop the GitLab pipeline needed.
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The job runs on the runner host, so the service is reachable on
      # localhost via the port mapping above.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
      DATA_DIR: data/sample      # load the committed sample, not data/raw
      LLM_PROVIDER: echo         # offline NL-to-SQL; no API key required

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt

      # Build the warehouse (sample) + seed the app schema / read-only role / admin.
      - name: Load sample warehouse
        run: python -m src.warehouse.load
      - name: Seed auth schema, read-only role and admin user
        run: python -m src.api.auth.manage init

      - name: Run tests
        run: pytest -q --junitxml=report.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  # Build the image and push it to the repository's Container Registry.
  # Runs only on main and tags, after tests pass.
  build:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
